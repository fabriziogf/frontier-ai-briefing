name: daily

# ingest -> cluster -> rank -> enrich -> daily digest (spec section 11)
# Manual only until M1 lands. Then enable the cron (10:30 UTC is 6:30 New York during EDT;
# GitHub cron is UTC only, so it shifts an hour in winter).
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "30 10 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
      FEEDBACK_HMAC_SECRET: ${{ secrets.FEEDBACK_HMAC_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra embed
      # TODO(M1): restore the DB from private storage before, and save it after.
      - run: uv run briefing init-db
      - run: uv run briefing ingest
      - run: uv run briefing rank
      - run: uv run briefing enrich
      - run: uv run briefing daily
