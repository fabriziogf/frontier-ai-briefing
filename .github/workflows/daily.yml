name: daily

# ingest -> cluster -> rank -> daily digest (spec section 11)
# State lives in the private repo fabriziogf/frontier-ai-briefing-data: briefing.db plus
# daily/<date>.md. GitHub cron is UTC only: 11:30 UTC is 6:30 New York in winter (EST) and
# 7:30 in summer (EDT).
on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *"

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: fabriziogf/frontier-ai-briefing-data
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}
          path: state
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      - run: uv sync --locked --extra embed
      - name: Restore DB
        run: |
          mkdir -p data
          if [ -f state/briefing.db ]; then cp state/briefing.db data/briefing.db; fi
      - run: uv run briefing ingest
      - run: uv run briefing rank
      # The digest and the state commit run even if an earlier stage failed.
      - if: always()
        run: uv run briefing daily
      - name: Save DB and digest
        if: always()
        run: |
          cp data/briefing.db state/briefing.db
          mkdir -p state/daily
          cp output/daily/*.md state/daily/ 2>/dev/null || true
          cd state
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "daily $(TZ=America/New_York date +%F)"
          git push
