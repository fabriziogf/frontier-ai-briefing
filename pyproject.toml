[project]
name = "briefing"
version = "0.1.0"
description = "Personal pipeline that filters frontier AI news and research, explains papers at the right depth, and produces a weekly audio briefing."
authors = [
    { name = "Fabrizio GF", email = "fabriziogf@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "feedparser>=6.0.14",
    "jinja2>=3.1.6",
    "langgraph>=1.2.18",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pydub>=0.25.1",
    "pymupdf>=2.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "requests-cache>=1.3.3",
    "sqlite-vec>=0.1.9",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
]

[project.scripts]
briefing = "briefing.cli:app"

[project.optional-dependencies]
embed = [
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# CPU-only PyTorch on Linux (CI): the default PyPI wheel pulls ~2 GB of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
